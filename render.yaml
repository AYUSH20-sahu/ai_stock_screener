services:
  - type: web
    name: ai-stock-screener-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://ai-stock-screener.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        value: AQ.Ab8RN6KAr_8pAx_8sv0A20odgVSCLQMBU6IW7MUfuMYG0Q24WQ
      - key: ALPHA_VANTAGE_API_KEY
        value: KM19MLYTU6ZRVO8S
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
